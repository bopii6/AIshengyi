<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>为什么是现在？</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&display=swap"
        rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans SC', sans-serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 50%, #16213e 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
            overflow: hidden;
        }

        .slide {
            width: 100%;
            max-width: 1100px;
            text-align: center;
        }

        .main-title {
            font-size: 2.4rem;
            font-weight: 900;
            color: white;
            margin-bottom: 10px;
        }

        .main-title .highlight {
            color: #ff6b6b;
        }

        .subtitle {
            font-size: 1.1rem;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 25px;
        }

        .timeline-container {
            display: flex;
            justify-content: center;
            align-items: stretch;
            gap: 0;
            margin-bottom: 25px;
        }

        .timeline-item {
            flex: 1;
            max-width: 300px;
            padding: 20px 25px;
            position: relative;
            border: 2px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.02);
        }

        .timeline-item:first-child {
            border-radius: 16px 0 0 16px;
            border-right: none;
        }

        .timeline-item:last-child {
            border-radius: 0 16px 16px 0;
            border-left: none;
        }

        .timeline-item.past {
            opacity: 0.5;
        }

        .timeline-item.now {
            background: linear-gradient(145deg, rgba(0, 212, 255, 0.15), rgba(123, 104, 238, 0.1));
            border-color: #00d4ff;
            transform: scale(1.05);
            z-index: 1;
            border-radius: 16px;
        }

        .timeline-item.future {
            opacity: 0.6;
        }

        .time-label {
            display: inline-block;
            padding: 5px 15px;
            border-radius: 15px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .past .time-label {
            background: rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.5);
        }

        .now .time-label {
            background: linear-gradient(90deg, #00d4ff, #7b68ee);
            color: white;
        }

        .future .time-label {
            background: rgba(255, 107, 107, 0.2);
            color: #ff6b6b;
        }

        .time-title {
            font-size: 1.4rem;
            font-weight: 700;
            color: white;
            margin-bottom: 8px;
        }

        .time-desc {
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.9rem;
            line-height: 1.4;
        }

        .time-icon {
            font-size: 2.2rem;
            margin-bottom: 10px;
        }

        .bottom-quote {
            background: rgba(255, 107, 107, 0.1);
            border: 2px solid rgba(255, 107, 107, 0.3);
            border-radius: 15px;
            padding: 18px 35px;
        }

        .quote-text {
            font-size: 1.2rem;
            color: white;
            font-weight: 700;
        }

        .quote-text .accent {
            color: #ff6b6b;
        }

        .corner-badge {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #00d4ff;
            color: #0a0a0a;
            padding: 8px 18px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.9rem;
        }
    </style>
</head>

<body>
    <div class="corner-badge">🔴 直播专属</div>
    <div class="slide">
        <h1 class="main-title">
            为什么是 <span class="highlight">现在</span> 要学？
        </h1>
        <p class="subtitle">2026年，AI编程迎来分水岭</p>

        <div class="timeline-container">
            <div class="timeline-item past">
                <div class="time-icon">🔙</div>
                <div class="time-label">去年</div>
                <div class="time-title">AI = 玩具</div>
                <div class="time-desc">
                    只能做Demo<br>
                    只能写贪吃蛇<br>
                    做不了真项目
                </div>
            </div>

            <div class="timeline-item now">
                <div class="time-icon">🔥</div>
                <div class="time-label">现在 2026</div>
                <div class="time-title">AI = 生产力</div>
                <div class="time-desc">
                    能做商业级产品<br>
                    一人单挑一个团队<br>
                    一周交付完整项目
                </div>
            </div>

            <div class="timeline-item future">
                <div class="time-icon">⚠️</div>
                <div class="time-label">后年</div>
                <div class="time-title">AI = 常识</div>
                <div class="time-desc">
                    不会就落伍<br>
                    红利期已过<br>
                    被时代淘汰
                </div>
            </div>
        </div>

        <div class="bottom-quote">
            <div class="quote-text">
                10年前不会上网是文盲，<span class="accent">2026年不会AI是新文盲</span>
            </div>
        </div>
    </div>
    <script src="slide-nav.js"></script>
</body>

</html>
