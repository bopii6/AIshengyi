<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我做了什么？</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&display=swap"
        rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans SC', sans-serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 50%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px;
        }

        .slide {
            width: 100%;
            max-width: 1400px;
            text-align: center;
        }

        .section-label {
            display: inline-block;
            background: linear-gradient(90deg, #00d4ff, #7b68ee);
            color: white;
            padding: 10px 30px;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 30px;
        }

        .main-title {
            font-size: 3.5rem;
            font-weight: 900;
            color: white;
            margin-bottom: 20px;
        }

        .subtitle {
            font-size: 1.5rem;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 50px;
        }

        .subtitle .highlight {
            color: #ff6b6b;
            font-weight: 700;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 40px;
            margin-bottom: 50px;
        }

        .product-card {
            background: linear-gradient(145deg, rgba(255, 255, 255, 0.05), rgba(255, 255, 255, 0.02));
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 30px;
            padding: 50px 40px;
            text-align: left;
            position: relative;
            overflow: hidden;
        }

        .product-card::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(0, 212, 255, 0.1) 0%, transparent 70%);
        }

        .product-number {
            position: absolute;
            top: 20px;
            right: 30px;
            font-size: 6rem;
            font-weight: 900;
            color: rgba(255, 255, 255, 0.05);
        }

        .product-icon {
            font-size: 4rem;
            margin-bottom: 25px;
        }

        .product-name {
            font-size: 2rem;
            font-weight: 700;
            color: white;
            margin-bottom: 15px;
        }

        .product-desc {
            color: rgba(255, 255, 255, 0.7);
            font-size: 1.2rem;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .product-features {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .feature-tag {
            background: rgba(0, 212, 255, 0.15);
            color: #00d4ff;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.95rem;
            font-weight: 500;
        }

        .highlight-box {
            background: linear-gradient(90deg, rgba(255, 107, 107, 0.15), rgba(255, 165, 0, 0.15));
            border: 2px solid rgba(255, 107, 107, 0.3);
            border-radius: 20px;
            padding: 30px 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
        }

        .highlight-icon {
            font-size: 3rem;
        }

        .highlight-text {
            font-size: 1.8rem;
            color: white;
            font-weight: 700;
        }

        .highlight-text .accent {
            color: #ff6b6b;
        }

        .corner-badge {
            position: fixed;
            top: 30px;
            right: 30px;
            background: #00d4ff;
            color: #0a0a0a;
            padding: 10px 25px;
            border-radius: 8px;
            font-weight: 700;
        }
    </style>
</head>

<body>
    <div class="corner-badge">🔴 直播专属</div>
    <div class="slide">
        <div class="section-label">💼 实战成果展示</div>
        <h1 class="main-title">我做了什么？</h1>
        <p class="subtitle">
            零代码基础，<span class="highlight">一行代码都没写</span>，纯靠AI辅助完成
        </p>

        <div class="products-grid">
            <div class="product-card">
                <div class="product-number">01</div>
                <div class="product-icon">🤖</div>
                <div class="product-name">AI一键数字人生成</div>
                <div class="product-desc">
                    输入对标链接 → 10分钟生成原创数字人短视频<br>
                    半自动15分钟，全自动10分钟
                </div>
                <div class="product-features">
                    <span class="feature-tag">语音克隆</span>
                    <span class="feature-tag">形象生成</span>
                    <span class="feature-tag">全网分发</span>
                    <span class="feature-tag">矩阵运营</span>
                </div>
            </div>

            <div class="product-card">
                <div class="product-number">02</div>
                <div class="product-icon">🎮</div>
                <div class="product-name">游戏化英语学习系统</div>
                <div class="product-desc">
                    商业级完整系统，已交付给教育机构老板<br>
                    前端+后端+数据库+AI大模型
                </div>
                <div class="product-features">
                    <span class="feature-tag">用户登录</span>
                    <span class="feature-tag">学习进度</span>
                    <span class="feature-tag">AI老师</span>
                    <span class="feature-tag">后台管理</span>
                </div>
            </div>
        </div>

        <div class="highlight-box">
            <div class="highlight-icon">⚡</div>
            <div class="highlight-text">
                两周交付，全程<span class="accent">零代码</span>，你也可以！
            </div>
        </div>
    </div>
    <script src="slide-nav.js"></script>
</body>

</html>
